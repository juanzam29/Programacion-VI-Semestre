<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineWorld</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="logo"> CineWorld</div>

      <nav class="menu">
        <a href="#">Inicio</a>
        <a href="#">Estrenos</a>
        <a href="#">Géneros</a>
        <a href="#">Favoritos</a>
      </nav>

      <button id="themeToggle" class="theme-btn" type="button">🌙</button>
    </header>

    <section class="hero">
      <div class="hero-text">
        <p class="eyebrow">Descubre tu próxima película favorita</p>
        <h1>CineWorld</h1>
      </div>

      <div class="search-box">
        <input
          id="searchInput"
          type="text"
          placeholder="Buscar películas..."
          aria-label="Buscar películas"
        />
      </div>
    </section>

    <section class="filters" aria-label="Filtros de género">
      <button class="filter-btn active" data-filter="all" type="button">Todas</button>
      <button class="filter-btn" data-filter="Acción" type="button">Acción</button>
      <button class="filter-btn" data-filter="Comedia" type="button">Comedia</button>
      <button class="filter-btn" data-filter="Terror" type="button">Terror</button>
      <button class="filter-btn" data-filter="Ciencia ficción" type="button">Ciencia ficción</button>
      <button class="filter-btn" data-filter="Animación" type="button">Animación</button>
    </section>

    <main>
      <div id="movieList" class="movie-grid"></div>
    </main>

    <footer class="footer">
      <p>© 2026 CineWorld | Tu catálogo favorito</p>
    </footer>
  </body>

  <div id="movieModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-btn" type="button">×</button>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="./js/main.js"></script>
</html>
